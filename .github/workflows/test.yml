name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x
      # Fails the build if any service-specific or private token slipped into the tree.
      - run: ./scripts/scrub-check.sh
      # Includes the content-auth signer and 3DES round-trip checks, plus the scrub guard test.
      - run: dotnet test Jellyfin.Plugin.Portalito.sln --configuration Release
