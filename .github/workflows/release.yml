name: release

# On a version tag (v0.1.0.0), build the plugin zip, attach it to a GitHub Release, and update
# manifest.json so the Jellyfin plugin repository serves the new version.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Build the exact tagged commit (default checkout of a tag push), so the release always matches the tag
      # even if main has moved on since.
      # Actions pinned by commit; the checkout keeps no token in .git/config while tests run (the manifest step
      # authenticates its own push).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x

      # Fail fast: a tag that isn't meta.json's version would publish the previous version's zip under the new tag (and
      # point that version's manifest entry at it) -- the stale-asset trap.
      - name: Tag matches version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('packaging/meta.json'))['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG doesn't match packaging/meta.json version $version" >&2
            exit 1
          fi

      # Fail fast: a release without a CHANGELOG.md entry would ship with empty notes.
      - name: Release notes
        run: |
          version=$(python3 -c "import json; print(json.load(open('packaging/meta.json'))['version'])")
          python3 packaging/release_notes.py "$version" > "$RUNNER_TEMP/release-notes.md"

      - name: Build and test
        run: dotnet test Jellyfin.Plugin.Portalito.sln --configuration Release

      - name: Scrub check
        run: ./scripts/scrub-check.sh

      - name: Package
        id: package
        run: |
          out=$(python3 packaging/package.py)
          zip=$(echo "$out" | sed -n '1p')
          md5=$(echo "$out" | sed -n '2p' | awk '{print $2}')
          version=$(python3 -c "import json; print(json.load(open('packaging/meta.json'))['version'])")
          abi=$(python3 -c "import json; print(json.load(open('packaging/meta.json'))['targetAbi'])")
          echo "zip=$zip"       >> "$GITHUB_OUTPUT"
          echo "md5=$md5"       >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "abi=$abi"       >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ steps.package.outputs.zip }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          gh release create "$TAG" "$ZIP" \
            --title "Portalito $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Update manifest.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.package.outputs.version }}
          MD5: ${{ steps.package.outputs.md5 }}
          ABI: ${{ steps.package.outputs.abi }}
        run: |
          # Update manifest.json on main (not the detached tag checkout), retrying if main moved meanwhile.
          git config user.name  "Jaime Aguilar"
          git config user.email "jaheaga@gmail.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch origin main
          git checkout -B main origin/main
          pushed=false
          for attempt in 1 2 3 4 5; do
            python3 packaging/update_manifest.py "$REPO" "$TAG" "$VERSION" "$MD5" "$ABI"
            git add manifest.json
            git commit -m "chore(release): manifest for $VERSION" || { echo "nothing to commit"; pushed=true; break; }
            if git push origin main; then echo "pushed"; pushed=true; break; fi
            echo "push rejected, rebasing (attempt $attempt)"
            git reset --hard origin/main
            git fetch origin main
            git checkout -B main origin/main
          done
          # A release without its manifest entry is invisible to every server's plugin catalog: fail loudly.
          [ "$pushed" = true ] || { echo "manifest.json was never pushed" >&2; exit 1; }
